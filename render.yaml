# Render Blueprint：一个 Java Web 服务 + 一个 PostgreSQL 数据库
# 在 Render Dashboard 用 "New + -> Blueprint" 选本仓库即可一键创建。
# 免费套餐说明：Web 服务闲置 15 分钟后休眠（首次访问需等约 1 分钟唤醒），
# 免费 PostgreSQL 90 天后过期；课堂演示够用，长期使用需升级套餐。
services:
  - type: web
    name: campus-buddy
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: campus-buddy-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: campus-buddy-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: campus-buddy-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: campus-buddy-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: campus-buddy-db
          property: password
      - key: INVITE_TTL
        value: "120"
      - key: SWEEP_SECONDS
        value: "10"

databases:
  - name: campus-buddy-db
    plan: free
    databaseName: campus_buddy

# 校园活动组队与候补平台 · Spring Boot 配置
# 所有可变项都可由环境变量覆盖，不写死机器路径和密码。
server.port=${PORT:8080}
# 数据库地址：DB_URL 优先（本地沿用 jdbc:postgresql://127.0.0.1:5433/campus_buddy）；
# 未设 DB_URL 时用 DB_HOST/DB_PORT/DB_NAME 拼（Render 部署用此方式注入）。
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:campus_buddy}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
# 启动时建表（IF NOT EXISTS，不删已有数据）；种子数据由 SeedRunner 在空库时写入
# continue-on-error 必须为 false：旧值为 true 时建表失败会被静默吞掉，
# 应用带着残缺的表启动，之后种子写入才报错，根因极难定位。建表语句本身
# 全是 IF NOT EXISTS，正常重启不会报错，改为 fail-fast 是安全的。
spring.sql.init.mode=always
spring.sql.init.schema-locations=${DB_SCHEMA:classpath:schema.sql}
spring.sql.init.continue-on-error=false
# 递补邀请确认窗口（秒）：演示默认 120；答辩想等超时顺延时可设为 10
app.invite-ttl-seconds=${INVITE_TTL:120}
# 超时扫描周期（秒）：SRS 建议 30；演示默认 10，方便现场看到顺延
app.sweep-seconds=${SWEEP_SECONDS:10}
spring.jackson.time-zone=Asia/Shanghai

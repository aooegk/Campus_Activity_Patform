# 校园活动组队与候补平台 · Spring Boot 配置
# 所有可变项都可由环境变量覆盖，不写死机器路径和密码。
server.port=${PORT:8080}
# HTTP 压缩（任务 20 返工，2026-11-07）：Spring Boot 默认不压缩静态资源，
# 首屏 JS 冷加载实传 89KB。开启后 JS/CSS 走 gzip，实传约 34KB。
# mime-types 含 text/javascript（Tomcat 对静态 JS 返回的 Content-Type），
# min-response-size=1KB 保证 4.9KB 的 CSS 也压缩。
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1KB
# 数据库地址：DB_URL 优先（本地沿用 jdbc:postgresql://127.0.0.1:5433/campus_buddy）；
# 未设 DB_URL 时用 DB_HOST/DB_PORT/DB_NAME 拼（Render 部署用此方式注入）。
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:campus_buddy}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
# 启动时建表（IF NOT EXISTS，不删已有数据）；种子数据由 SeedRunner 在空库时写入
# continue-on-error 必须为 false：旧值为 true 时建表失败会被静默吞掉，
# 应用带着残缺的表启动，之后种子写入才报错，根因极难定位。建表语句本身
# 全是 IF NOT EXISTS，正常重启不会报错，改为 fail-fast 是安全的。
spring.sql.init.mode=always
spring.sql.init.schema-locations=${DB_SCHEMA:classpath:schema.sql}
spring.sql.init.continue-on-error=false
# 递补邀请确认窗口（秒）：演示默认 120；答辩想等超时顺延时可设为 10
app.invite-ttl-seconds=${INVITE_TTL:120}
# 递补邀请白天时段（任务 8，2026-11-08 补丁，文档不改）：只在此时段内发出新邀请，
# 夜间出现空缺不发邀请、只给候补第 1 名发提示，等白天由 sweep 补发。时段 [start, end)，
# 默认 8:00–22:00（服务器时间 Asia/Shanghai）；窗口 120 秒不变。
app.invite-day-start-hour=${INVITE_DAY_START_HOUR:8}
app.invite-day-end-hour=${INVITE_DAY_END_HOUR:22}
# 超时扫描周期（秒）：SRS 建议 30；演示默认 10，方便现场看到顺延
app.sweep-seconds=${SWEEP_SECONDS:10}
# Jackson 时区：保留 Asia/Shanghai。PostgreSQL 驱动把 TIMESTAMP 列返回为
# Timestamp（Date 子类），Jackson 按此时区序列化才是库里存的东八区墙钟原值；
# MySQL 驱动返回 LocalDateTime，按原值序列化。此配置不是换算，与存储口径一致。
spring.jackson.time-zone=Asia/Shanghai
